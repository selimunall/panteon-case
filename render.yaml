# Render Blueprint — deploy the Panteon leaderboard.
# Creates: managed Postgres + Key Value (Redis), one API web service (runs the API + the
# background worker together and self-seeds on boot), and a static client.
# MongoDB is external (Atlas) — set MONGO_URL as a secret on the API service.

databases:
  - name: panteon-pg
    databaseName: leaderboard
    user: panteon
    plan: free

services:
  - type: keyvalue          # managed Redis
    name: panteon-redis
    plan: free
    ipAllowList: []         # internal access only

  - type: web
    name: panteon-api
    runtime: docker
    dockerfilePath: ./docker/server.Dockerfile
    dockerContext: .
    dockerCommand: pnpm --filter @panteon/server start:all:prod
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: panteon-pg, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: panteon-redis, property: connectionString }
      - key: MONGO_URL
        sync: false          # ← set to your MongoDB Atlas SRV URL
      - key: MONGO_DB
        value: leaderboard
      - key: CORS_ORIGIN
        value: "*"
      - key: DEMO_TRAFFIC
        value: "true"        # in-process traffic so the demo board moves (no separate worker)
      - key: PORT
        value: "3000"

  - type: web
    name: panteon-client
    runtime: static
    buildCommand: npx --yes pnpm@9.15.9 install --no-frozen-lockfile && npx --yes pnpm@9.15.9 --filter @panteon/client build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false          # ← set to the panteon-api URL (e.g. https://panteon-api-xxxx.onrender.com)
